[build]
  # R2 模式：先安装依赖，再处理图片，最后构建站点
  command = "pnpm install && pnpm build:r2"
  publish = "dist"

[build.environment]
  # 使用 Node.js 20
  NODE_VERSION = "20"
  # 安装 devDependencies（包含 tsx）
  NPM_FLAGS = "--version"
  # 存储模式
  STORAGE_MODE = "r2"
  # 图片访问域名（R2 绑定的自定义域名）
  R2_PUBLIC_URL = "https://photos.echorains.top"

# 处理 SPA 路由（如果需要）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
